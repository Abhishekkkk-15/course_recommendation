<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Recommendation Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="brand-badge">Catalog &amp; Advisory</span>
        <h1 class="brand-title">Course Finder</h1>
        <p class="brand-description">
          Find suitable courses by domain, difficulty level, skill goals, or budget constraints.
        </p>
      </div>
    </header>

    <main class="main-content">
      <!-- Search Section -->
      <section class="search-section">
        <form id="search-form" class="search-form">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="8.5" cy="8.5" r="5.5" />
              <path d="M13 13l4 4" />
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="e.g. beginner python courses under 5000, or CA intermediate group 1..."
              autocomplete="off"
              required
            />
            <button type="button" id="clear-btn" class="clear-btn" aria-label="Clear search" hidden>&times;</button>
            <button type="submit" id="submit-btn" class="submit-btn">
              <span class="btn-text">Search</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
        </form>

        <!-- Quick Query Chips -->
        <div class="quick-queries">
          <span class="quick-label">Try searching:</span>
          <div class="chips-list">
            <button type="button" class="chip" data-query="Python programming for beginners under 5000">Python Beginner &le; ₹5k</button>
            <button type="button" class="chip" data-query="CA Foundation complete preparation">CA Foundation</button>
            <button type="button" class="chip" data-query="Intermediate financial modelling and excel">Financial Modelling</button>
            <button type="button" class="chip" data-query="GST practical certification course">GST Certification</button>
            <button type="button" class="chip" data-query="show all courses">All Courses</button>
          </div>
        </div>
      </section>

      <!-- Status / Notification -->
      <div id="status-bar" class="status-bar" hidden></div>

      <!-- Matched Courses Grid -->
      <section id="courses-section" class="courses-section">
        <div class="section-header">
          <h2 id="courses-title" class="section-title">Available Catalog Courses</h2>
          <span id="courses-count" class="courses-count">Loading catalog...</span>
        </div>
        <div id="courses-grid" class="courses-grid">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Recommendation Narrative -->
      <section id="recommendation-section" class="recommendation-section" hidden>
        <div class="section-header">
          <h2 class="section-title">Advisor Recommendations</h2>
        </div>
        <div id="recommendation-content" class="recommendation-content"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Course Recommendation Engine &bull; Minimal Static Interface</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
